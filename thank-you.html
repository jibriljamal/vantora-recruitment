<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Vantora Recruitment</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thank-you-card {
            width: 100%;
            max-width: 650px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 8px;
            padding: 55px 40px;
            text-align: center;
        }

        .eyebrow {
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .main-text {
            color: #cccccc;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .cv-message {
            color: #aaaaaa;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .cv-message a {
            color: #d4af37;
            text-decoration: none;
        }

        .cv-message a:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            background: #d4af37;
            color: #000000;
            padding: 14px 25px;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #f0cc54;
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {

            .thank-you-card {
                padding: 45px 25px;
            }

            h1 {
                font-size: 38px;
            }

            .main-text {
                font-size: 16px;
            }

        }

    </style>
</head>

<body>

    <div class="thank-you-card">

        <div class="eyebrow">
            Vantora Recruitment
        </div>

        <h1>
            Thank You.
        </h1>

        <p class="main-text">
            Your details have been received successfully.
        </p>

        <p class="cv-message">
            If you are applying for work, please remember to email
            your CV to
            <a href="mailto:vantorarecruitment@gmail.com">
                vantorarecruitment@gmail.com
            </a>
            so we can review your experience and match you with
            suitable opportunities.
        </p>

        <a href="/" class="btn">
            Back To Website
        </a>

    </div>

</body>

</html>
