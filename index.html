<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vantora Recruitment | Construction & Skilled Trades</title>

<meta name="description" content="Vantora Recruitment connects construction businesses with reliable workers and skilled tradespeople across the UK.">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: #ffffff;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

.container {
    width: min(1100px, 90%);
    margin: auto;
}

/* =========================
   NAVIGATION
========================= */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(5,5,5,0.96);
    border-bottom: 1px solid #292929;
    backdrop-filter: blur(10px);
}

.nav-container {
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.nav-logo {
    display: flex;
    align-items: center;
}

.nav-logo img {
    width: 150px;
    height: auto;
    display: block;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
}

.nav-links a {
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    transition: 0.2s ease;
}

.nav-links a:hover {
    color: #d9ad32;
}

.nav-button {
    background: #d9ad32;
    color: #050505 !important;
    padding: 11px 18px;
    border-radius: 4px;
}

.nav-button:hover {
    background: #ffffff;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 650px;
    display: flex;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 20%, rgba(217,173,50,0.12), transparent 35%),
        #050505;
}

.hero-content {
    max-width: 850px;
    margin: auto;
}

/* HERO LOGO - CHANGED */
.hero-logo {
    width: 220px;
    height: 60px;
    object-fit: fill;
    margin: 0 auto 35px;
    display: block;
}

.eyebrow {
    color: #d9ad32;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 18px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 72px);
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 25px;
    color: #ffffff;
}

.hero h1 span {
    color: #d9ad32;
}

.hero p {
    max-width: 650px;
    margin: auto;
    color: #c7c7c7;
    font-size: 18px;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 25px;
    border-radius: 4px;
    font-weight: 800;
    font-size: 14px;
    border: 1px solid #d9ad32;
    cursor: pointer;
    transition: 0.2s ease;
}

.btn-primary {
    background: #d9ad32;
    color: #050505;
}

.btn-primary:hover {
    background: #ffffff;
    border-color: #ffffff;
}

.btn-secondary {
    background: transparent;
    color: #ffffff;
}

.btn-secondary:hover {
    background: #d9ad32;
    color: #050505;
}

/* =========================
   GENERAL SECTIONS
========================= */

section {
    padding: 85px 0;
    border-bottom: 1px solid #222222;
}

.section-label {
    color: #d9ad32;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.section-title {
    font-size: clamp(32px, 5vw, 48px);
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 16px;
    color: #ffffff;
}

.section-intro {
    color: #aaaaaa;
    max-width: 650px;
    font-size: 16px;
}

/* =========================
   SERVICES
========================= */

.services {
    background: #080808;
}

.service-grid {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.service {
    padding: 30px 25px;
    border: 1px solid #292929;
    border-top: 3px solid #d9ad32;
    border-radius: 5px;
    background: #0d0d0d;
    transition: 0.2s ease;
}

.service:hover {
    transform: translateY(-4px);
    border-color: #d9ad32;
}

.service-number {
    color: #d9ad32;
    font-size: 11px;
    font-weight: 900;
    margin-bottom: 12px;
}

.service h3 {
    color: #ffffff;
    margin-bottom: 8px;
    font-size: 18px;
}

.service p {
    color: #999999;
    font-size: 14px;
}

/* =========================
   EMPLOYER / CANDIDATE CHOICES
========================= */

.choice-section {
    background: #050505;
}

.choice-grid {
    margin-top: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.choice {
    padding: 40px;
    border: 1px solid #292929;
    background: #0b0b0b;
    border-radius: 5px;
}

.choice h3 {
    color: #d9ad32;
    font-size: 24px;
    margin-bottom: 10px;
}

.choice p {
    color: #aaaaaa;
    margin-bottom: 25px;
}

/* =========================
   FORMS
========================= */

.form-section {
    background: #090909;
}

.form-box {
    max-width: 850px;
    margin: 40px auto 0;
    background: #0d0d0d;
    border: 1px solid #292929;
    border-top: 3px solid #d9ad32;
    border-radius: 5px;
    padding: 35px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 12px;
    font-weight: 800;
    color: #dddddd;
    margin-bottom: 7px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #333333;
    border-radius: 4px;
    background: #050505;
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #d9ad32;
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}

.form-group select option {
    background: #050505;
    color: #ffffff;
}

.form-submit {
    margin-top: 25px;
}

.form-note {
    color: #777777;
    font-size: 11px;
    margin-top: 12px;
}

/* =========================
   CONTACT
========================= */

.contact {
    background: #050505;
    text-align: center;
}

.contact-content {
    max-width: 700px;
    margin: auto;
}

.contact-content .section-intro {
    margin: 0 auto 30px;
}

.contact-buttons {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #000000;
    border-top: 1px solid #222222;
    padding: 40px 0 25px;
}

.footer-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 30px;
}

.footer-logo {
    width: 170px;
}

.footer-brand p {
    color: #777777;
    font-size: 12px;
    margin-top: 8px;
}

.footer-links {
    display: flex;
    gap: 25px;
}

.footer-links a {
    color: #aaaaaa;
    font-size: 13px;
}

.footer-links a:hover {
    color: #d9ad32;
}

.footer-bottom {
    border-top: 1px solid #222222;
    margin-top: 30px;
    padding-top: 20px;
    color: #666666;
    font-size: 11px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .nav-links {
        display: none;
    }

    .hero {
        min-height: 600px;
    }
